server:
  port: 8080

spring:
  main:
    banner-mode: off

agent:
  # 任何 OpenAI 兼容网关都可以：阿里云百炼 / DeepSeek / Moonshot / OpenAI / 本地 Ollama
  base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  api-key: ${API_KEY:}
  model: ${OPENAI_MODEL:qwen3.8-flash}
#  temperature: 0.2
  max-steps: 6
  # 模型一次只返回 "思考 + 一个动作"，靠多轮把任务拆下去
  max-observation-chars: 1200
  connect-timeout: 10s
  read-timeout: 90s
  # 单次工具执行预算；超时只形成失败 Observation，不直接终止整次运行
  tool-timeout: 10s
  # 整次运行的总预算，覆盖所有模型轮次和工具调用；超时后中断运行线程
  run-timeout: 5m
  # 关掉控制台交互，只保留网页和 HTTP 入口（POST /api/agent/ask）
  cli-enabled: false

logging:
  level:
    com.gene.agent: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
